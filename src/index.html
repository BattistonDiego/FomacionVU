<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <title>SupportHub | Manual de Atención</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SupportHub: base de conocimientos para la atención al cliente."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the saved theme before the first paint (no light flash). Same key as ThemeService. -->
    <script>
      try {
        if (localStorage.getItem('supporthub_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171313');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
