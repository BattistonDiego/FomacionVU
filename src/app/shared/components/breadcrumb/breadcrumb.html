<nav aria-label="Ruta de navegación">
  <ol class="breadcrumb">
    @for (item of items(); track $index; let last = $last) {
      <li class="breadcrumb__item">
        @if (item.link && !last) {
          <a class="breadcrumb__link" [routerLink]="item.link" [queryParams]="item.queryParams">
            {{ item.label }}
          </a>
        } @else {
          <span [class.breadcrumb__current]="last" [attr.aria-current]="last ? 'page' : null">
            {{ item.label }}
          </span>
        }
      </li>
    }
  </ol>
</nav>
