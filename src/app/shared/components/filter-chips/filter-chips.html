<div class="chips" role="group" [attr.aria-labelledby]="labelId">
  <span class="chips__label" [id]="labelId">{{ label() }}</span>
  <button
    type="button"
    class="chip"
    [class.chip--active]="selected() === null"
    [attr.aria-pressed]="selected() === null"
    (click)="selected.set(null)"
  >
    {{ allLabel() }}
    @if (allCount() !== undefined) {
      <span class="chip__count">{{ allCount() }}</span>
    }
  </button>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="chip"
      [class.chip--active]="selected() === option.value"
      [attr.aria-pressed]="selected() === option.value"
      (click)="selected.set(option.value)"
    >
      {{ option.label }}
      <span class="chip__count">{{ option.count }}</span>
    </button>
  }
</div>
